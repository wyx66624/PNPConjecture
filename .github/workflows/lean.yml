name: Lean verification

on:
  push:
    branches:
      - main
      - "research/**"
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Reject proof placeholders and user axioms
        shell: bash
        run: |
          set -euo pipefail
          if grep -RInE '\b(sorry|admit|axiom)\b' \
              --include='*.lean' PNPConjecture.lean PNPConjecture; then
            echo "Lean source contains a forbidden proof placeholder or user axiom."
            exit 1
          fi

      - name: Install Lean through elan
        shell: bash
        run: |
          set -euo pipefail
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh \
            | sh -s -- -y
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: Build all Lean proofs
        run: lake build
